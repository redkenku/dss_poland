    <div id='page'>
        <div id="mid_panel">
            <header>
                <h1 id="game-title">Polish Red Autumn</h1>
                <h2 id="game-author">redkenku</h2>

                <div id="header-links">
                    <a id="stats-link" onclick="window.showStats();" href="#">Polish Dossier</a>
                    <a onclick="dendryUI.showSaveSlots();" href="#">Save/Load</a>
                    <a onclick="window.showOptions();" href="#">Options</a>
                </div>
                <div id="radio" hidden>
                    <strong>Radio</strong>
                    <button id="radio-toggle" type="button" onclick="window.toggleRadio();">Pause</button>

                    <span id="radio-track" aria-live="polite"></span>
                </div>
            </header>
            <div id="tools_wrapper">
                <div id='stats_sidebar' class='tools left'>
                    <div class="tab_container" role="tablist" aria-label="Polish political ledger">
                        <button class="tab_button active" id="main_tab" role="tab" aria-selected="true" aria-controls="qualities" tabindex="0" onclick="window.changeTab('status', 'main_tab');"><span>Pulse</span></button>
                        <button class="tab_button" id="politics_tab" role="tab" aria-selected="false" aria-controls="qualities" tabindex="-1" onclick="window.changeTab('status.politics', 'politics_tab');"><span>Parties</span></button>

                        <button class="tab_button" id="poll_tab" role="tab" aria-selected="false" aria-controls="qualities" tabindex="-1" onclick="window.changeTab('status.polls', 'poll_tab');"><span>Indicators</span></button>
                        <button class="tab_button" id="mood_tab" role="tab" aria-selected="false" aria-controls="qualities" tabindex="-1" onclick="window.changeTab('status.opinion', 'mood_tab');"><span>Mood</span></button>
                        <button class="tab_button" id="emergency_tab" role="tab" aria-selected="false" aria-controls="qualities" tabindex="-1" onclick="window.changeTab('status.emergency', 'emergency_tab');"><span>Crisis</span></button>
                    </div>
                    <div id="qualities" role="tabpanel" aria-labelledby="main_tab">
                    </div>
                </div>
                <div id='stats_sidebar_right' class='tools right'>
